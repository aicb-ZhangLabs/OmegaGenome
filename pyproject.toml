[project]
name = "omega-genome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.6.0",
    "nntool==2.1.0",
    "numpy==1.26.4",
    "pandas>=2.0",
    "psutil>=5.9",
    "pydantic==2.10.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.7.2",
    "tqdm>=4.66",
    "tyro>=0.9.33",
    "wandb>=0.17",
]

[project.optional-dependencies]
default = [
    "torch==2.6.0",
    "transformers==4.57.1",
    "peft>=0.17.1",
    "accelerate==1.10.1",
    "datasets>=4.2.0",
    "einops>=0.8.1",
    "mamba-ssm==2.2.4",
    "enformer-pytorch>=0.8",
]
# Base-resolution multi-track regression (NTv3 teacher + track students).
ntv3 = [
    "torch==2.6.0",
    "transformers==4.57.1",
    "torchmetrics>=1.4",
    "pyBigWig>=0.3.22",
    "pyfaidx>=0.8",
]
# Figure and analysis scripts.
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]
aido_dna = [
    "torch==2.6.0",
    "modelgenerator>=0.1.2",
]
caduceus = [
    "torch==2.6.0",
]

[tool.uv]
conflicts = [
    [
      { extra = "default" },
      { extra = "aido_dna" },
      { extra = "caduceus" },
      { extra = "ntv3" },
    ],
]
no-build-isolation-package = ['mamba-ssm']

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true



[tool.ruff]
# Specify the Python version you're targeting
target-version = "py311"

# Set the maximum line length
line-length = 100

# Enable auto-fixing for specific rule categories
fix = true

# Directories to include/exclude
include = ["*.py", "*.pyi", "**/pyproject.toml"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
]
